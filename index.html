<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="全国12都市の最新天気をニュース形式で流す、ライブ配信・OBS向け横1980×縦50pxの天気弾幕。">
  <title>全国の天気ニュース弾幕 | Chat Spam</title>
  <style>
    :root {
      color-scheme: dark;
      --bar-bg: rgba(5, 16, 31, .97);
      --bar-line: rgba(100, 190, 255, .38);
      --text: #f3f8ff;
      --muted: #aac3dd;
      --accent: #71ddff;
      --warm: #ffd166;
      --alert: #ffad9e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      min-height: 50px;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    body { color: var(--text); }
    .weather-bar {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 50px;
      overflow: hidden;
      isolation: isolate;
      background: var(--bar-bg);
      border-top: 1px solid var(--bar-line);
      border-bottom: 1px solid var(--bar-line);
      box-shadow: 0 2px 14px rgba(0, 0, 0, .25);
    }
    .weather-bar::before, .weather-bar::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 32px;
      pointer-events: none;
    }
    .weather-bar::before {
      left: 0;
      background: linear-gradient(90deg, rgba(5,16,31,1), rgba(5,16,31,0));
    }
    .weather-bar::after {
      right: 0;
      background: linear-gradient(270deg, rgba(5,16,31,1), rgba(5,16,31,0));
    }
    .track {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      width: max-content;
      min-width: max-content;
      height: 100%;
      animation: ticker-scroll 95s linear infinite;
      will-change: transform;
    }
    .weather-bar:hover .track { animation-play-state: paused; }
    .ticker-copy {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 25px;
      height: 100%;
      padding: 0 24px;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .015em;
      line-height: 1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .06em;
    }
    .brand-icon {
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: linear-gradient(135deg, #174a85, #167c9e);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      font-size: 18px;
    }
    .breaking {
      color: #071426;
      background: var(--warm);
      border-radius: 4px;
      padding: 6px 9px;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .04em;
    }
    .item { display: inline-flex; align-items: center; gap: 7px; }
    .separator {
      display: inline-block;
      width: 1px;
      height: 22px;
      background: linear-gradient(transparent, rgba(130,178,220,.55), transparent);
    }
    .headline { color: #f6f9ff; font-weight: 800; }
    .region { color: var(--accent); font-weight: 900; }
    .city { color: #d7eaff; }
    .condition-icon { font-size: 22px; }
    .temperature { color: var(--warm); font-size: 19px; font-weight: 950; }
    .forecast-temp { color: var(--warm); }
    .label { color: var(--muted); font-size: 13px; font-weight: 650; }
    .rain-alert { color: var(--alert); }
    .updated { color: var(--muted); font-size: 12px; font-weight: 600; }
    .source { color: #8ba9c7; font-size: 11px; font-weight: 500; }
    .status { color: #d5e7f8; font-size: 14px; font-weight: 650; }
    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .track { animation-duration: 180s; }
    }
  </style>
</head>
<body>
  <main class="weather-bar" aria-label="全国の最新天気ニュース">
    <div class="track" id="track">
      <div class="ticker-copy" id="copy-a">
        <span class="brand"><span class="brand-icon">☁</span> WEATHER NEWS JAPAN</span>
        <span class="status" id="status">全国の最新天気を取得しています…</span>
      </div>
      <div class="ticker-copy" id="copy-b" aria-hidden="true">
        <span class="brand"><span class="brand-icon">☁</span> WEATHER NEWS JAPAN</span>
        <span class="status">全国の最新天気を取得しています…</span>
      </div>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      // 北海道から沖縄まで、全国の天気を代表する12都市
      const cities = [
        { name: "札幌", region: "北海道", lat: 43.0642, lon: 141.3469 },
        { name: "青森", region: "東北", lat: 40.8246, lon: 140.7406 },
        { name: "仙台", region: "東北", lat: 38.2682, lon: 140.8721 },
        { name: "新潟", region: "北陸", lat: 37.9026, lon: 139.0236 },
        { name: "東京", region: "関東", lat: 35.6762, lon: 139.6503 },
        { name: "名古屋", region: "東海", lat: 35.1815, lon: 136.9066 },
        { name: "大阪", region: "近畿", lat: 34.6937, lon: 135.5023 },
        { name: "広島", region: "中国", lat: 34.3853, lon: 132.4553 },
        { name: "高知", region: "四国", lat: 33.5597, lon: 133.5311 },
        { name: "福岡", region: "九州", lat: 33.5902, lon: 130.4017 },
        { name: "鹿児島", region: "九州", lat: 31.5966, lon: 130.5571 },
        { name: "那覇", region: "沖縄", lat: 26.2124, lon: 127.6809 }
      ];
      const copyA = document.getElementById("copy-a");
      const copyB = document.getElementById("copy-b");
      const track = document.getElementById("track");
      const status = document.getElementById("status");
      let lastSuccessfulUpdate = null;
      let isLoading = false;

      const weatherText = {
        0: ["快晴", "☀️"], 1: ["おおむね晴れ", "🌤️"], 2: ["晴れ時々くもり", "⛅"], 3: ["くもり", "☁️"],
        45: ["霧", "🌫️"], 48: ["霧氷を伴う霧", "🌫️"],
        51: ["弱い霧雨", "🌦️"], 53: ["霧雨", "🌦️"], 55: ["強い霧雨", "🌧️"],
        56: ["凍る弱い霧雨", "🌧️"], 57: ["凍る霧雨", "🌧️"],
        61: ["弱い雨", "🌦️"], 63: ["雨", "🌧️"], 65: ["強い雨", "🌧️"],
        66: ["凍雨", "🌧️"], 67: ["強い凍雨", "🌧️"],
        71: ["弱い雪", "🌨️"], 73: ["雪", "❄️"], 75: ["強い雪", "❄️"], 77: ["雪粒", "🌨️"],
        80: ["弱いにわか雨", "🌦️"], 81: ["にわか雨", "🌧️"], 82: ["強いにわか雨", "⛈️"],
        85: ["弱いにわか雪", "🌨️"], 86: ["強いにわか雪", "❄️"],
        95: ["雷雨", "⛈️"], 96: ["ひょうを伴う雷雨", "⛈️"], 99: ["強い雷雨・ひょう", "⛈️"]
      };
      const safe = function (value) {
        return String(value == null ? "—" : value).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      };
      const weather = function (code) {
        return weatherText[Number(code)] || ["天気情報", "🌤️"];
      };
      const round = function (value) {
        return value !== null && value !== undefined && Number.isFinite(Number(value)) ? Math.round(Number(value)) : "—";
      };
      const num = function (value) {
        return value !== null && value !== undefined && Number.isFinite(Number(value)) ? Number(value) : null;
      };
      const isRainOrSnow = function (code) {
        return [51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].includes(Number(code));
      };
      const isAlert = function (code) {
        return [65,67,75,82,86,95,96,99].includes(Number(code));
      };
      const fmtTime = function (value) {
        if (!value) return "時刻不明";
        const match = String(value).match(/T(\d{2}:\d{2})/);
        return match ? match[1] : "時刻不明";
      };
      function buildMarkup(results) {
        const valid = results.filter(function (r) { return r && r.current && r.daily && r.daily.time; });
        if (!valid.length) throw new Error("weather data unavailable");

        const wetNow = valid.filter(function (r) { return isRainOrSnow(r.current.weather_code); });
        const alertNow = valid.filter(function (r) { return isAlert(r.current.weather_code); });
        const rainRisk = valid.filter(function (r) {
          const p = num(r.daily.precipitation_probability_max && r.daily.precipitation_probability_max[0]);
          return p !== null && p >= 40;
        });
        const maxCity = valid.slice().sort(function (a, b) {
          return (num(b.daily.temperature_2m_max && b.daily.temperature_2m_max[0]) ?? -999) -
                 (num(a.daily.temperature_2m_max && a.daily.temperature_2m_max[0]) ?? -999);
        })[0];
        const minCity = valid.slice().sort(function (a, b) {
          return (num(a.daily.temperature_2m_min && a.daily.temperature_2m_min[0]) ?? 999) -
                 (num(b.daily.temperature_2m_min && b.daily.temperature_2m_min[0]) ?? 999);
        })[0];

        const parts = [];
        parts.push('<span class="brand"><span class="brand-icon">☁</span> WEATHER NEWS JAPAN</span>');
        parts.push('<span class="breaking">全国の天気 NEWS</span>');
        parts.push('<span class="separator"></span>');
        parts.push('<span class="headline">全国12都市の最新概況</span>');
        parts.push('<span class="item"><span class="label">現在、雨・雪</span><span class="' + (wetNow.length ? 'rain-alert' : '') + '">' + wetNow.length + '都市</span></span>');
        parts.push('<span class="item"><span class="label">きょう降水確率40%以上</span><span class="' + (rainRisk.length ? 'rain-alert' : '') + '">' + rainRisk.length + '都市</span></span>');
        parts.push('<span class="item"><span class="label">予想最高気温</span><span class="city">' + safe(maxCity.name) + '</span><span class="temperature">' + safe(round(maxCity.daily.temperature_2m_max[0])) + '℃</span></span>');
        parts.push('<span class="item"><span class="label">予想最低気温</span><span class="city">' + safe(minCity.name) + '</span><span class="temperature">' + safe(round(minCity.daily.temperature_2m_min[0])) + '℃</span></span>');
        if (alertNow.length) {
          parts.push('<span class="item rain-alert"><span>注意：</span><span>' + safe(alertNow.map(function (r) { return r._city.name; }).join("・")) + 'で強い雨・雪・雷の情報</span></span>');
        }
        const regionOrder = ["北海道", "東北", "北陸", "関東", "東海", "近畿", "中国", "四国", "九州", "沖縄"];
        regionOrder.forEach(function (region) {
          const list = valid.filter(function (r) { return r._city.region === region; });
          if (!list.length) return;
          parts.push('<span class="separator"></span>');
          parts.push('<span class="region">【' + safe(region) + '】</span>');
          list.forEach(function (r) {
            const current = r.current;
            const w = weather(current.weather_code);
            const pop = num(r.daily.precipitation_probability_max && r.daily.precipitation_probability_max[0]);
            const alertClass = (pop !== null && pop >= 50) || isAlert(current.weather_code) ? " rain-alert" : "";
            parts.push('<span class="item"><span class="city">' + safe(r._city.name) + '</span><span class="condition-icon">' + w[1] + '</span><span>' + safe(w[0]) + '</span><span class="temperature">' + safe(round(current.temperature_2m)) + '℃</span><span class="label">最高' + safe(round(r.daily.temperature_2m_max[0])) + '°／最低' + safe(round(r.daily.temperature_2m_min[0])) + '°</span><span class="label' + alertClass + '">降水' + safe(round(pop)) + '%</span></span>');
          });
        });
        const nowTime = valid[0].current.time || "";
        const update = fmtTime(nowTime);
        parts.push('<span class="separator"></span>');
        parts.push('<span class="updated">最新データ ' + safe(update) + '・10分ごとに自動更新</span>');
        parts.push('<span class="source">Weather data: Open-Meteo</span>');

        const markup = parts.join("");
        copyA.innerHTML = markup;
        copyB.innerHTML = markup;
        status.textContent = "全国の天気ニュースを表示中";
        lastSuccessfulUpdate = Date.now();
        requestAnimationFrame(function () {
          const width = copyA.getBoundingClientRect().width;
          track.style.animationDuration = Math.max(70, Math.min(180, width / 26)) + "s";
        });
      }

      async function loadWeather() {
        if (isLoading) return;
        isLoading = true;
        if (!lastSuccessfulUpdate) status.textContent = "全国の最新天気を取得しています…";
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude: cities.map(function (c) { return c.lat; }).join(","),
          longitude: cities.map(function (c) { return c.lon; }).join(","),
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
          forecast_days: "2",
          timezone: "Asia/Tokyo"
        }).toString();
        try {
          const response = await fetch(url.toString(), { cache: "no-store" });
          if (!response.ok) throw new Error("weather request failed: " + response.status);
          const raw = await response.json();
          const results = Array.isArray(raw) ? raw : [raw];
          results.forEach(function (r, i) { r._city = cities[i]; });
          if (results.length !== cities.length || results.some(function (r) { return !r || !r.current || !r.daily; })) {
            throw new Error("incomplete nationwide forecast");
          }
          buildMarkup(results);
        } catch (error) {
          console.error("Nationwide weather update failed:", error);
          if (lastSuccessfulUpdate) {
            const warning = '<span class="separator"></span><span class="status rain-alert">更新に失敗しました。表示中の天気は前回取得時の情報です。</span>';
            copyA.insertAdjacentHTML("beforeend", warning);
            copyB.insertAdjacentHTML("beforeend", warning);
          } else {
            const message = '<span class="brand"><span class="brand-icon">☁</span> WEATHER NEWS JAPAN</span><span class="separator"></span><span class="status">全国の天気データを取得できません。ネット接続を確認し、自動再取得をお待ちください。</span><span class="source">Weather data: Open-Meteo</span>';
            copyA.innerHTML = message;
            copyB.innerHTML = message;
          }
        } finally {
          isLoading = false;
        }
      }

      loadWeather();
      window.setInterval(loadWeather, 10 * 60 * 1000);
    }());
  </script>
</body>
</html>
