<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="ライブ配信の下に配置できる、最新の天気予報を表示する横1980×縦50ピクセルの天気弾幕。">
  <title>最新天気予報 弾幕 | Chat Spam</title>
  <style>
    :root {
      color-scheme: dark;
      --bar-bg: rgba(7, 20, 38, .96);
      --bar-line: rgba(115, 190, 255, .34);
      --text: #f4f8ff;
      --muted: #a9c3df;
      --accent: #67d7ff;
      --warm: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 50px;
      min-height: 50px;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    body { color: var(--text); }
    .weather-bar {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 50px;
      overflow: hidden;
      isolation: isolate;
      background: var(--bar-bg);
      border-top: 1px solid var(--bar-line);
      border-bottom: 1px solid var(--bar-line);
      box-shadow: 0 2px 14px rgba(0, 0, 0, .22);
    }
    .weather-bar::before, .weather-bar::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 42px;
      pointer-events: none;
    }
    .weather-bar::before {
      left: 0;
      background: linear-gradient(90deg, rgba(7,20,38,1), rgba(7,20,38,0));
    }
    .weather-bar::after {
      right: 0;
      background: linear-gradient(270deg, rgba(7,20,38,1), rgba(7,20,38,0));
    }
    .track {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      width: max-content;
      min-width: max-content;
      height: 100%;
      animation: ticker-scroll 76s linear infinite;
      will-change: transform;
    }
    .weather-bar:hover .track { animation-play-state: paused; }
    .ticker-copy {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 28px;
      height: 100%;
      padding: 0 26px;
      white-space: nowrap;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .brand-icon {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(135deg, #174a85, #167c9e);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      font-size: 18px;
    }
    .item { display: inline-flex; align-items: center; gap: 8px; }
    .separator {
      display: inline-block;
      width: 1px;
      height: 22px;
      background: linear-gradient(transparent, rgba(130,178,220,.55), transparent);
    }
    .city { color: var(--accent); }
    .condition-icon { font-size: 25px; }
    .temperature { color: var(--warm); font-size: 23px; font-weight: 900; }
    .label { color: var(--muted); font-size: 15px; font-weight: 600; }
    .forecast-day { color: #d8e8fa; }
    .forecast-temp { color: var(--warm); }
    .updated { color: var(--muted); font-size: 13px; font-weight: 500; }
    .status { color: #d5e7f8; font-size: 15px; font-weight: 600; }
    .source { color: #8ca9c8; font-size: 12px; font-weight: 500; }
    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .track { animation-duration: 180s; }
    }
  </style>
</head>
<body>
  <main class="weather-bar" aria-label="最新の天気予報">
    <div class="track" id="track">
      <div class="ticker-copy" id="copy-a">
        <span class="brand"><span class="brand-icon">☁</span> LIVE WEATHER</span>
        <span class="status" id="status">最新の天気を取得しています…</span>
      </div>
      <div class="ticker-copy" id="copy-b" aria-hidden="true">
        <span class="brand"><span class="brand-icon">☁</span> LIVE WEATHER</span>
        <span class="status">最新の天気を取得しています…</span>
      </div>
    </div>
  </main>
  <script>
    (function () {
      "use strict";
      const params = new URLSearchParams(location.search);
      const latValue = Number(params.get("lat"));
      const lonValue = Number(params.get("lon"));
      const latitude = Number.isFinite(latValue) && params.has("lat") ? latValue : 38.2682;
      const longitude = Number.isFinite(lonValue) && params.has("lon") ? lonValue : 140.8694;
      const city = (params.get("city") || "仙台市").slice(0, 24);
      const copyA = document.getElementById("copy-a");
      const copyB = document.getElementById("copy-b");
      const track = document.getElementById("track");
      const status = document.getElementById("status");
      const weatherText = {
        0: ["快晴", "☀️"], 1: ["おおむね晴れ", "🌤️"], 2: ["一部くもり", "⛅"], 3: ["くもり", "☁️"],
        45: ["霧", "🌫️"], 48: ["霧氷を伴う霧", "🌫️"],
        51: ["弱い霧雨", "🌦️"], 53: ["霧雨", "🌦️"], 55: ["強い霧雨", "🌧️"],
        56: ["凍る弱い霧雨", "🌧️"], 57: ["凍る霧雨", "🌧️"],
        61: ["弱い雨", "🌦️"], 63: ["雨", "🌧️"], 65: ["強い雨", "🌧️"],
        66: ["凍雨", "🌧️"], 67: ["強い凍雨", "🌧️"],
        71: ["弱い雪", "🌨️"], 73: ["雪", "❄️"], 75: ["強い雪", "❄️"], 77: ["雪粒", "🌨️"],
        80: ["弱いにわか雨", "🌦️"], 81: ["にわか雨", "🌧️"], 82: ["強いにわか雨", "⛈️"],
        85: ["弱いにわか雪", "🌨️"], 86: ["強いにわか雪", "❄️"],
        95: ["雷雨", "⛈️"], 96: ["ひょうを伴う雷雨", "⛈️"], 99: ["強い雷雨・ひょう", "⛈️"]
      };
      const safe = function (value) {
        return String(value == null ? "—" : value).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      };
      const weather = function (code) {
        return weatherText[code] || ["天気情報", "🌤️"];
      };
      const round = function (value) {
        return Number.isFinite(Number(value)) ? Math.round(Number(value)) : "—";
      };
      const weekday = function (dateString, index) {
        if (index === 0) return "今日";
        if (index === 1) return "明日";
        const d = new Date(dateString + "T12:00:00+09:00");
        return ["日", "月", "火", "水", "木", "金", "土"][d.getDay()] + "曜日";
      };
      function buildMarkup(data) {
        const now = data.current || {};
        const todayWeather = weather(now.weather_code);
        const parts = [];
        parts.push('<span class="brand"><span class="brand-icon">☁</span> LIVE WEATHER</span>');
        parts.push('<span class="separator"></span>');
        parts.push('<span class="item"><span class="city">' + safe(city) + '</span><span class="condition-icon">' + todayWeather[1] + '</span><span>' + safe(todayWeather[0]) + '</span></span>');
        parts.push('<span class="item"><span class="temperature">' + safe(round(now.temperature_2m)) + '℃</span><span class="label">現在</span></span>');
        parts.push('<span class="item"><span class="label">体感</span><span>' + safe(round(now.apparent_temperature)) + '℃</span></span>');
        parts.push('<span class="item"><span class="label">湿度</span><span>' + safe(round(now.relative_humidity_2m)) + '%</span></span>');
        parts.push('<span class="item"><span class="label">降水</span><span>' + safe(round(now.precipitation)) + ' mm</span></span>');
        parts.push('<span class="item"><span class="label">風速</span><span>' + safe(round(now.wind_speed_10m)) + ' km/h</span></span>');
        const daily = data.daily || {};
        const dates = daily.time || [];
        for (let i = 0; i < Math.min(3, dates.length); i++) {
          const w = weather(daily.weather_code && daily.weather_code[i]);
          parts.push('<span class="separator"></span>');
          parts.push('<span class="item forecast-day"><span>' + safe(weekday(dates[i], i)) + '</span><span class="condition-icon">' + w[1] + '</span><span>' + safe(w[0]) + '</span><span class="forecast-temp">' + safe(round(daily.temperature_2m_min && daily.temperature_2m_min[i])) + '〜' + safe(round(daily.temperature_2m_max && daily.temperature_2m_max[i])) + '℃</span><span class="label">降水確率 ' + safe(round(daily.precipitation_probability_max && daily.precipitation_probability_max[i])) + '%</span></span>');
        }
        const update = now.time ? new Date(now.time).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" }) : "—";
        parts.push('<span class="separator"></span>');
        parts.push('<span class="updated">更新 ' + safe(update) + '（10分ごとに自動更新）</span>');
        parts.push('<span class="source">Weather data: Open-Meteo</span>');
        const markup = parts.join("");
        copyA.innerHTML = markup;
        copyB.innerHTML = markup;
        status.textContent = "天気情報を表示中";
        requestAnimationFrame(function () {
          const width = copyA.getBoundingClientRect().width;
          track.style.animationDuration = Math.max(42, Math.min(120, width / 28)) + "s";
        });
      }
      async function loadWeather() {
        status.textContent = "最新の天気を取得しています…";
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.search = new URLSearchParams({
          latitude: String(latitude),
          longitude: String(longitude),
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
          forecast_days: "3",
          timezone: "Asia/Tokyo"
        }).toString();
        try {
          const response = await fetch(url.toString(), { cache: "no-store" });
          if (!response.ok) throw new Error("weather request failed: " + response.status);
          const data = await response.json();
          if (!data.current || !data.daily) throw new Error("weather response incomplete");
          buildMarkup(data);
        } catch (error) {
          const message = '<span class="brand"><span class="brand-icon">☁</span> LIVE WEATHER</span><span class="separator"></span><span class="status">' + safe(city) + '：天気情報を取得できませんでした。接続を確認して再取得します。</span><span class="source">Weather data: Open-Meteo</span>';
          copyA.innerHTML = message;
          copyB.innerHTML = message;
        }
      }
      loadWeather();
      window.setInterval(loadWeather, 10 * 60 * 1000);
    }());
  </script>
</body>
</html>
