<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="GitHub Actionsが定期取得する日本語ニュースの見出しと時刻だけを流す、ライブ配信・OBS向け1980×50pxニュース速報弾幕。">
  <title>ニュース速報弾幕 | Chat Spam</title>
  <style>
    :root {
      color-scheme: dark;
      --bar-bg: rgba(5, 12, 24, .97);
      --bar-line: rgba(105, 177, 234, .42);
      --text: #f4f7fc;
      --muted: #a9bbd2;
      --accent: #8bd7ff;
      --breaking: #ff3f52;
      --gold: #ffd166;
      --warn: #ffb3a8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 50px; min-height: 50px;
      overflow: hidden; background: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    body { color: var(--text); }
    .news-bar {
      position: relative; display: flex; align-items: center; width: 100%; height: 50px;
      overflow: hidden; isolation: isolate; background: var(--bar-bg);
      border-top: 1px solid var(--bar-line); border-bottom: 1px solid var(--bar-line);
      box-shadow: 0 2px 14px rgba(0, 0, 0, .25);
    }
    .news-bar::before, .news-bar::after {
      content: ""; position: absolute; z-index: 3; top: 0; bottom: 0; width: 28px; pointer-events: none;
    }
    .news-bar::before { left: 0; background: linear-gradient(90deg, rgba(5,12,24,1), rgba(5,12,24,0)); }
    .news-bar::after { right: 0; background: linear-gradient(270deg, rgba(5,12,24,1), rgba(5,12,24,0)); }
    .track {
      display: flex; flex: 0 0 auto; align-items: center; width: max-content; min-width: max-content;
      height: 100%; animation: ticker-scroll 140s linear infinite; will-change: transform;
    }
    .news-bar:hover .track { animation-play-state: paused; }
    .ticker-copy {
      display: flex; flex: 0 0 auto; align-items: center; gap: 22px; height: 100%;
      padding: 0 22px; white-space: nowrap; font-size: 16px; font-weight: 700; line-height: 1;
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 16px; font-weight: 950; letter-spacing: .05em; }
    .brand-icon {
      display: inline-grid; place-items: center; width: 29px; height: 29px; border-radius: 7px;
      background: linear-gradient(145deg, #1d4679, #167e9b); box-shadow: inset 0 0 0 1px rgba(255,255,255,.17); font-size: 16px;
    }
    .breaking {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 4px;
      background: var(--breaking); color: white; font-size: 13px; font-weight: 950; letter-spacing: .035em;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: currentColor;
      box-shadow: 0 0 7px currentColor; animation: live-pulse 1.5s ease-in-out infinite;
    }
    .item { display: inline-flex; align-items: center; gap: 8px; }
    .separator { display: inline-block; width: 1px; height: 22px; background: linear-gradient(transparent, rgba(130,178,220,.55), transparent); }
    .time { color: var(--gold); font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .headline { color: #f3f7ff; font-weight: 750; text-decoration: none; }
    .headline:hover { color: var(--accent); }
    .source { color: var(--muted); font-size: 12px; font-weight: 650; }
    .updated { color: var(--muted); font-size: 12px; font-weight: 600; }
    .status { color: #dce9f8; font-size: 14px; font-weight: 650; }
    .stale { color: var(--warn); font-size: 12px; font-weight: 800; }
    @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes live-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .track { animation-duration: 240s; } .live-dot { animation: none; } }
  </style>
</head>
<body>
  <main class="news-bar" aria-label="最新ニュース速報">
    <div class="track" id="track">
      <div class="ticker-copy" id="copy-a">
        <span class="brand"><span class="brand-icon">N</span> NEWS FLASH</span>
        <span class="breaking"><span class="live-dot"></span>最新ニュース</span>
        <span class="status" id="status">GitHubからニュースを読み込んでいます…</span>
      </div>
      <div class="ticker-copy" id="copy-b" aria-hidden="true">
        <span class="brand"><span class="brand-icon">N</span> NEWS FLASH</span>
        <span class="breaking"><span class="live-dot"></span>最新ニュース</span>
        <span class="status">GitHubからニュースを読み込んでいます…</span>
      </div>
    </div>
  </main>
  <script>
    (function () {
      "use strict";
      const NEWS_URL = new URL("./news.json", location.href);
      const UPDATE_INTERVAL_MS = 60 * 1000;
      const MAX_HEADLINES = 45;
      const copyA = document.getElementById("copy-a");
      const copyB = document.getElementById("copy-b");
      const track = document.getElementById("track");
      let isLoading = false;
      let previousSignature = "";

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
        });
      }
      function safeUrl(value) {
        try {
          const url = new URL(String(value || ""));
          return (url.protocol === "https:" || url.protocol === "http:") ? url.href : "";
        } catch (error) { return ""; }
      }
      function formatTime(value) {
        if (!value) return "時刻不明";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "時刻不明";
        return new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        }).format(date);
      }
      function safeArticles(data) {
        if (!data || !Array.isArray(data.articles)) return [];
        // Sort in the browser too, so the ticker stays newest-to-oldest even
        // if the published JSON arrives in an unexpected order.
        const candidates = data.articles.map(function (item) {
          return {
            title: String(item.title || "").replace(/\s+/g, " ").trim(),
            url: safeUrl(item.url),
            source: String(item.source || item.domain || "ニュース配信元").slice(0, 100),
            domain: String(item.domain || "").slice(0, 100),
            publishedAt: item.publishedAt || null
          };
        }).filter(function (item) {
          return !!item.title && item.title.length >= 6 && !!item.url;
        }).sort(function (a, b) {
          const aTime = a.publishedAt ? Date.parse(a.publishedAt) : NaN;
          const bTime = b.publishedAt ? Date.parse(b.publishedAt) : NaN;
          const aValid = Number.isFinite(aTime);
          const bValid = Number.isFinite(bTime);
          if (aValid && bValid) return bTime - aTime;
          if (aValid) return -1; // Put articles without a date at the end.
          if (bValid) return 1;
          return 0;
        });

        const seen = new Set();
        return candidates.filter(function (item) {
          const key = item.url.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        }).slice(0, MAX_HEADLINES);
      }
      function render(data) {
        const articles = safeArticles(data);
        const parts = [
          '<span class="brand"><span class="brand-icon">N</span> NEWS FLASH</span>',
          '<span class="breaking"><span class="live-dot"></span>最新ニュース</span>',
          '<span class="separator"></span>'
        ];
        if (articles.length) {
          articles.forEach(function (article, index) {
            if (index) parts.push('<span class="separator"></span>');
            const title = article.title.length > 200 ? article.title.slice(0, 197) + "…" : article.title;
            parts.push('<span class="item">' +
              '<span class="time">' + escapeHtml(formatTime(article.publishedAt)) + '</span>' +
              '<a class="headline" href="' + escapeHtml(article.url) + '" target="_blank" rel="noopener noreferrer" title="' + escapeHtml(title) + '">' + escapeHtml(title) + '</a>' +
              '</span>');
          });
        } else {
          parts.push('<span class="status">ニュースはまだありません。GitHub Actionsの取得処理を確認してください。</span>');
        }

        parts.push('<span class="separator"></span>');
        if (data && data.stale) {
          parts.push('<span class="stale">ニュース更新に失敗・前回データを表示中</span>');
        }
        parts.push('<span class="updated">取得 ' + escapeHtml(formatTime(data && data.updatedAt)) + ' JST</span>');
        parts.push('<span class="updated">GitHub確認 ' + escapeHtml(formatTime(data && data.checkedAt)) + ' JST</span>');

        const markup = parts.join("");
        copyA.innerHTML = markup;
        copyB.innerHTML = markup;
        requestAnimationFrame(function () {
          const width = copyA.getBoundingClientRect().width;
          track.style.animationDuration = Math.max(90, Math.min(240, width / 55)) + "s";
        });
      }

      async function fetchPublishedNews() {
        if (isLoading) return;
        isLoading = true;
        try {
          const url = new URL(NEWS_URL.href);
          url.searchParams.set("t", String(Date.now()));
          const response = await fetch(url.href, { cache: "no-store" });
          if (!response.ok) throw new Error("news.json returned HTTP " + response.status);
          const data = await response.json();
          if (!data || !Array.isArray(data.articles)) throw new Error("news.json format is invalid");
          const signature = JSON.stringify(data);
          if (signature !== previousSignature) {
            previousSignature = signature;
            render(data);
          }
        } catch (error) {
          console.error("Could not load published news.json:", error);
          if (!previousSignature) {
            const message = '<span class="brand"><span class="brand-icon">N</span> NEWS FLASH</span><span class="breaking">最新ニュース</span><span class="status">ニュースデータを読み込めません。GitHub Actionsの実行状況を確認してください。</span>';
            copyA.innerHTML = message;
            copyB.innerHTML = message;
          }
        } finally {
          isLoading = false;
        }
      }

      fetchPublishedNews();
      window.setInterval(fetchPublishedNews, UPDATE_INTERVAL_MS);
    }());
  </script>
</body>
</html>
